version: '3.9'

services:
  # ─── PostgreSQL Database ────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: dhanlekha_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dhanlekha
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (OTP cache, rate limiting) ───────
  redis:
    image: redis:7-alpine
    container_name: dhanlekha_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── DhanLekha API ──────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dhanlekha_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:password@postgres:5432/dhanlekha?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production-32-chars-min}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-refresh-secret-32-chars-min}
      PORT: 3000
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    env_file:
      - .env

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  logs_data:
